version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seat-reservation-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-seatadmin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seatsecret123}
      POSTGRES_DB: ${DB_NAME:-seat_reservation_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-seatadmin} -d ${DB_NAME:-seat_reservation_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

