<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <defs>
    <!-- Architectural grid -->
    <pattern id="arch-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e2e8f0" stroke-width="0.8"/>
    </pattern>
    <!-- Diagonal hatching for core / walls -->
    <pattern id="wall-hatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#cbd5e1" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- Flooring Base -->
  <rect width="1200" height="750" fill="#f8fafc"/>
  <rect width="1200" height="750" fill="url(#arch-grid)"/>

  <!-- Building Perimeter / Structural Exterior Walls -->
  <rect x="25" y="25" width="1150" height="700" rx="16" fill="#ffffff" stroke="#1e293b" stroke-width="8"/>

  <!-- Exterior Windows along top and bottom -->
  <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round">
    <!-- Top Windows -->
    <line x1="120" y1="25" x2="320" y2="25"/>
    <line x1="420" y1="25" x2="780" y2="25"/>
    <line x1="880" y1="25" x2="1080" y2="25"/>
    <!-- Bottom Windows -->
    <line x1="120" y1="725" x2="320" y2="725"/>
    <line x1="420" y1="725" x2="780" y2="725"/>
    <line x1="880" y1="725" x2="1080" y2="725"/>
  </g>

  <!-- ==================== LEFT WING: MEETING ROOMS ==================== -->
  <!-- Conference Room 1 (Large Boardroom) -->
  <rect x="40" y="40" width="310" height="310" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
  <text x="195" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">BOARDROOM ALPHA</text>
  <text x="195" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">12 Seats · AV Screen</text>
  <!-- Boardroom Oval Table -->
  <rect x="100" y="130" width="190" height="110" rx="40" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <!-- Chairs around table -->
  <g fill="#94a3b8">
    <circle cx="130" cy="115" r="9"/>
    <circle cx="165" cy="115" r="9"/>
    <circle cx="195" cy="115" r="9"/>
    <circle cx="225" cy="115" r="9"/>
    <circle cx="260" cy="115" r="9"/>
    <circle cx="130" cy="255" r="9"/>
    <circle cx="165" cy="255" r="9"/>
    <circle cx="195" cy="255" r="9"/>
    <circle cx="225" cy="255" r="9"/>
    <circle cx="260" cy="255" r="9"/>
    <circle cx="85" cy="185" r="9"/>
    <circle cx="305" cy="185" r="9"/>
  </g>
  <!-- Wall Display / Video Bar -->
  <rect x="150" y="44" width="90" height="8" rx="2" fill="#0284c7"/>
  <!-- Door Swing Arc -->
  <path d="M 350 290 A 50 50 0 0 1 300 340" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="350" y1="290" x2="350" y2="340" stroke="#475569" stroke-width="3"/>

  <!-- Conference Room 2 (Brainstorming Studio) -->
  <rect x="40" y="380" width="310" height="325" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
  <text x="195" y="415" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">CREATIVE STUDIO</text>
  <text x="195" y="435" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Whiteboard Zone · Soft Seating</text>
  <!-- Circular Collaboration Table -->
  <circle cx="195" cy="530" r="55" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="195" cy="460" r="10" fill="#94a3b8"/>
  <circle cx="195" cy="600" r="10" fill="#94a3b8"/>
  <circle cx="125" cy="530" r="10" fill="#94a3b8"/>
  <circle cx="265" cy="530" r="10" fill="#94a3b8"/>
  <circle cx="145" cy="480" r="10" fill="#94a3b8"/>
  <circle cx="245" cy="580" r="10" fill="#94a3b8"/>
  <!-- Door Swing Arc -->
  <path d="M 350 400 A 50 50 0 0 0 300 380" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="350" y1="400" x2="300" y2="400" stroke="#475569" stroke-width="3"/>

  <!-- ==================== CENTER: OPEN HOT-DESKING ZONE ==================== -->
  <rect x="380" y="40" width="450" height="665" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Zone Header -->
  <rect x="440" y="55" width="330" height="36" rx="18" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="605" y="78" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e293b" text-anchor="middle" letter-spacing="1">
    HOT-DESKING COLLABORATION ZONE
  </text>

  <!-- POD 1: Window Desks (Top Cluster) -->
  <g id="pod-1-furniture">
    <!-- Pod boundary line -->
    <rect x="410" y="130" width="380" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="600" y="146" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">POD 1 · WINDOW &amp; QUIET</text>

    <!-- Desk Surfaces -->
    <!-- Left pair (D-01 & D-02) -->
    <rect x="430" y="160" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="510" y="160" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <!-- Right pair (D-03 & D-04) -->
    <rect x="630" y="160" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="710" y="160" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

    <!-- Desk Monitors on Desks -->
    <rect x="445" y="165" width="30" height="5" rx="1" fill="#475569"/>
    <rect x="525" y="165" width="30" height="5" rx="1" fill="#475569"/>
    <rect x="645" y="165" width="30" height="5" rx="1" fill="#475569"/>
    <rect x="725" y="165" width="30" height="5" rx="1" fill="#475569"/>

    <!-- Office Chairs -->
    <circle cx="460" cy="225" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="540" cy="225" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="660" cy="225" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="740" cy="225" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- POD 2: Team Collaboration (Middle Cluster) -->
  <g id="pod-2-furniture">
    <rect x="410" y="300" width="380" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="600" y="316" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">POD 2 · TEAM POD</text>

    <!-- Desk Surfaces (D-05, D-06, D-07, D-08) -->
    <rect x="430" y="330" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="510" y="330" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="630" y="330" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="710" y="330" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

    <!-- Monitors -->
    <rect x="445" y="335" width="30" height="5" rx="1" fill="#475569"/>
    <rect x="525" y="335" width="30" height="5" rx="1" fill="#475569"/>
    <rect x="645" y="335" width="30" height="5" rx="1" fill="#475569"/>
    <rect x="725" y="335" width="30" height="5" rx="1" fill="#475569"/>

    <!-- Office Chairs -->
    <circle cx="460" cy="395" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="540" cy="395" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="660" cy="395" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <circle cx="740" cy="395" r="10" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- POD 3: Standing Desks (Bottom Cluster) -->
  <g id="pod-3-furniture">
    <rect x="410" y="470" width="380" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="600" y="486" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">POD 3 · MOTORIZED STANDING DESKS</text>

    <!-- Desk Surfaces (D-09, D-10, D-11, D-12) -->
    <rect x="430" y="500" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="510" y="500" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="630" y="500" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="710" y="500" width="60" height="85" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>

    <!-- Monitors -->
    <rect x="445" y="505" width="30" height="5" rx="1" fill="#0284c7"/>
    <rect x="525" y="505" width="30" height="5" rx="1" fill="#0284c7"/>
    <rect x="645" y="505" width="30" height="5" rx="1" fill="#0284c7"/>
    <rect x="725" y="505" width="30" height="5" rx="1" fill="#0284c7"/>

    <!-- Standing Ergonomic Mats -->
    <rect x="445" y="565" width="30" height="15" rx="3" fill="#cbd5e1"/>
    <rect x="525" y="565" width="30" height="15" rx="3" fill="#cbd5e1"/>
    <rect x="645" y="565" width="30" height="15" rx="3" fill="#cbd5e1"/>
    <rect x="725" y="565" width="30" height="15" rx="3" fill="#cbd5e1"/>
  </g>

  <!-- Potted Office Plants in Open Space -->
  <g fill="#10b981" stroke="#059669" stroke-width="1.5">
    <circle cx="395" cy="140" r="12"/>
    <circle cx="805" cy="140" r="12"/>
    <circle cx="395" cy="610" r="12"/>
    <circle cx="805" cy="610" r="12"/>
  </g>

  <!-- ==================== RIGHT WING: EXECUTIVE & AMENITIES ==================== -->
  <!-- Executive Suites (Top Right) -->
  <rect x="850" y="40" width="310" height="240" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="4"/>
  <text x="1005" y="70" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">EXECUTIVE SUITE</text>
  <text x="1005" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Private Office · Meeting Desk</text>
  <!-- L-shaped Executive Desk -->
  <path d="M 900 120 L 1050 120 L 1050 160 L 960 160 L 960 210 L 900 210 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="930" cy="170" r="14" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <!-- Guest Armchairs -->
  <rect x="990" y="180" width="28" height="28" rx="4" fill="#cbd5e1"/>
  <rect x="1035" y="180" width="28" height="28" rx="4" fill="#cbd5e1"/>
  <!-- Door Swing Arc -->
  <path d="M 850 220 A 50 50 0 0 0 900 270" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="850" y1="220" x2="850" y2="270" stroke="#475569" stroke-width="3"/>

  <!-- Core Elevators & Restrooms (Middle Right) -->
  <rect x="850" y="300" width="310" height="150" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="3"/>
  <rect x="870" y="325" width="85" height="100" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="912" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">ELEVATOR 1</text>
  <rect x="970" y="325" width="85" height="100" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="1012" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">ELEVATOR 2</text>
  <rect x="1070" y="325" width="70" height="100" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="1105" y="375" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">RESTROOM</text>

  <!-- Cafeteria & Social Lounge (Bottom Right) -->
  <rect x="850" y="470" width="310" height="235" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text x="1005" y="500" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">CAFETERIA &amp; LOUNGE</text>
  <!-- Kitchen Counter -->
  <rect x="870" y="525" width="130" height="30" rx="4" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="935" y="545" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">Kitchen Bar</text>
  <!-- Round Cafe Tables -->
  <circle cx="1060" cy="560" r="28" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <circle cx="1060" cy="520" r="7" fill="#d97706"/>
  <circle cx="1060" cy="600" r="7" fill="#d97706"/>
  <circle cx="1020" cy="560" r="7" fill="#d97706"/>
  <circle cx="1100" cy="560" r="7" fill="#d97706"/>

  <circle cx="940" cy="630" r="28" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
  <circle cx="940" cy="590" r="7" fill="#d97706"/>
  <circle cx="940" cy="670" r="7" fill="#d97706"/>
  <circle cx="900" cy="630" r="7" fill="#d97706"/>
  <circle cx="980" cy="630" r="7" fill="#d97706"/>

  <!-- Compass / North Indicator (Bottom Left) -->
  <g transform="translate(60, 640)">
    <circle cx="20" cy="20" r="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <polygon points="20,6 25,20 15,20" fill="#ef4444"/>
    <polygon points="20,34 25,20 15,20" fill="#94a3b8"/>
    <text x="20" y="3" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ef4444" text-anchor="middle">N</text>
  </g>
</svg>
