# ==============================================================================
# Apache HTTPD VirtualHost Configuration for SeatSpace
# Workplace Seat Reservation System
# ==============================================================================
# Requirements:
#   sudo a2enmod proxy proxy_http ssl rewrite headers expires
#   For SSO: sudo apt install libapache2-mod-auth-gssapi && sudo a2enmod auth_gssapi
# ==============================================================================

<VirtualHost *:80>
    ServerName seats.company.local
    ServerAdmin sysadmin@company.local

    # Force HTTPS redirect
    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^/?(.*) https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/seatspace_error.log
    CustomLog ${APACHE_LOG_DIR}/seatspace_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName seats.company.local
    ServerAdmin sysadmin@company.local

    DocumentRoot /var/www/seatspace/dist

    # --------------------------------------------------------------------------
    # SSL/TLS Configuration
    # --------------------------------------------------------------------------
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/seatspace.crt
    SSLCertificateKeyFile /etc/ssl/private/seatspace.key
    # SSLCertificateChainFile /etc/ssl/certs/seatspace_chain.crt

    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder on

    # --------------------------------------------------------------------------
    # Enterprise Security Headers
    # --------------------------------------------------------------------------
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"

    # --------------------------------------------------------------------------
    # Static UI Files (Vue 3 Single Page Application deployed under /seats/)
    # --------------------------------------------------------------------------
    # When deployed under context path /seats/:
    Alias /seats /var/www/seatspace/dist

    <Directory /var/www/seatspace/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        # HTML5 History Mode Routing fallback for /seats/
        FallbackResource /seats/index.html
    </Directory>

    # Optional convenience redirect from root to /seats/
    RedirectMatch 302 ^/$ /seats/

    # Cache Control for Static Assets
    <FilesMatch "\.(ico|pdf|flv|jpg|jpeg|png|gif|svg|js|css|swf|woff|woff2)$">
        Header set Cache-Control "max-age=604800, public"
    </FilesMatch>

    # Disable Caching for index.html (Ensures instant deployment updates)
    <FilesMatch "index\.html$">
        Header set Cache-Control "no-cache, no-store, must-revalidate"
        Header set Pragma "no-cache"
        Header set Expires 0
    </FilesMatch>

    # --------------------------------------------------------------------------
    # Reverse Proxy to Node.js / NestJS Backend API
    # --------------------------------------------------------------------------
    ProxyPreserveHost On
    ProxyRequests Off

    # Forward client IP, host, and SSL status headers
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # ==========================================================================
    # Enterprise SSO (GSSAPI / Kerberos SPNEGO) Configuration [Optional]
    # ==========================================================================
    # To enable Active Directory / Kerberos SSO via mod_auth_gssapi:
    # 1. Install module: sudo apt install libapache2-mod-auth-gssapi
    # 2. Enable module:  sudo a2enmod auth_gssapi
    # 3. Export Keytab:  HTTP/seats.company.local@CORP.COMPANY.COM -> /etc/apache2/seatspace.keytab
    #
    # Anti-Header-Spoofing: ALWAYS strip incoming client X-Remote-User headers
    RequestHeader unset X-Remote-User

    # Option A: Protect dedicated SSO handshake endpoint (Recommended)
    # <Location /api/v1/auth/sso>
    #     AuthType GSSAPI
    #     AuthName "Corporate Kerberos Single Sign-On"
    #     GssapiCredStore keytab:/etc/apache2/seatspace.keytab
    #     GssapiLocalName on
    #     GssapiBasicAuth off
    #     GssapiNegotiateOnce on
    #     Require valid-user
    #     
    #     # Securely inject authenticated Kerberos identity to NestJS
    #     RequestHeader set X-Remote-User "%{REMOTE_USER}s" env=REMOTE_USER
    # </Location>
    # ==========================================================================

    # API endpoints routing
    ProxyPass /api/v1 http://127.0.0.1:3000/api/v1 timeout=60
    ProxyPassReverse /api/v1 http://127.0.0.1:3000/api/v1

    # Static uploads storage routing (if served through backend)
    ProxyPass /uploads http://127.0.0.1:3000/uploads
    ProxyPassReverse /uploads http://127.0.0.1:3000/uploads

    # --------------------------------------------------------------------------
    # Logging
    # --------------------------------------------------------------------------
    LogLevel warn
    ErrorLog ${APACHE_LOG_DIR}/seatspace_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/seatspace_ssl_access.log combined
</VirtualHost>

